[package]
name = "youtube-downloader"
version = "1.0.0"
description = "YouTube Downloader — video & audio downloader for YouTube"
authors = ["Md. Amzad Hossain Roni"]
edition = "2021"

[lib]
name = "youtube_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
