name: Release — YouTube Downloader

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons from SVG source
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Fetch sidecar binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Fetch sidecar binaries (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          chmod +x scripts/fetch-binaries.sh
          ./scripts/fetch-binaries.sh
          cd src-tauri/binaries
          ls -la

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "YouTube Downloader ${{ github.ref_name }}"
          releaseBody: "Download the installer for your system below. Windows: .exe - macOS: .dmg - Linux: .deb / .AppImage"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
