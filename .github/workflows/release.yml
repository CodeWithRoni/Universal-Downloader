name: Release — YouTube Downloader

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            fetch: windows
            builder: --win
          - platform: macos-latest
            fetch: mac arm64
            builder: --mac --arm64
          - platform: macos-latest
            fetch: mac x64
            builder: --mac --x64
          - platform: ubuntu-latest
            fetch: linux x64
            builder: --linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp + ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Fetch yt-dlp + ffmpeg (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          chmod +x scripts/fetch-binaries.sh
          ./scripts/fetch-binaries.sh ${{ matrix.fetch }}
          ls -la resources/bin

      - name: Build the UI
        run: npm run build

      - name: Generate app icons from SVG source
        run: npm run icons

      - name: Build installers (Electron)
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ strategy.job-index }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "YouTube Downloader ${{ github.ref_name }}"
          body: "Download the installer for your system below. Windows: .exe — macOS: .dmg — Linux: .AppImage / .deb"
          files: artifacts/**
